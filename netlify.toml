[build]
  # fetch:basemap pulls the offline PMTiles basemap archive (gitignored,
  # ~34 MB, refetched rather than committed — see scripts/fetch_basemap.cjs
  # and .gitignore). Without it the app still works, falling back to online
  # raster tiles capped at zoom 16, but the offline archive is what's intended.
  command = "npm run fetch:basemap && npm run build"
  publish = "dist"

# /api/metro/* is handled by netlify/functions/metro-proxy.js (see that file
# for why a plain redirect can't work: Netlify's redirect proxy overwrites
# any custom User-Agent header, same restriction as Vercel's Edge runtime).
# The function declares its own route via `export const config = { path }`,
# so no redirect rule is needed here.
