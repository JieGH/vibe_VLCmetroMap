[build]
  # fetch:basemap pulls the offline PMTiles basemap archive (gitignored,
  # ~34 MB, refetched rather than committed — see scripts/fetch_basemap.cjs
  # and .gitignore). Without it the app still works, falling back to online
  # raster tiles capped at zoom 16, but the offline archive is what's intended.
  command = "npm run fetch:basemap && npm run build"
  publish = "dist"

# /api/metro/* is handled by netlify/functions/metro-proxy.js, which forwards
# to FGV's live feed (see that file and ADR-0005). The function declares its
# own route via `export const config = { path }`, so no redirect rule is
# needed here.

# PREVIEW ONLY: make deploy previews call FGV alone, no relay fallback, to see
# the fully FGV-integrated site on Netlify. Remove before merging anything.
[context.deploy-preview.environment]
  METRO_SOURCE = "fgv"
